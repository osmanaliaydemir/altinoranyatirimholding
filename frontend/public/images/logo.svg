<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 80" fill="none">
  <defs>
    <!-- Liquid Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6B3" />
      <stop offset="25%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#FDF4D8" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Warm Golden Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E6B3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <!-- Golden Ambient Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==========================================
       1. GOLDEN RATIO (FIBONACCI) SPIRAL EMBLEM
       ========================================== -->
  <g transform="translate(4, 2)">
    <!-- Outer Golden Geometric Rings -->
    <circle cx="38" cy="38" r="36" stroke="url(#goldGradient)" stroke-width="1.4" stroke-opacity="0.4" stroke-dasharray="2 3.5" />
    <circle cx="38" cy="38" r="31" stroke="url(#goldGradient)" stroke-width="2" />

    <!-- Cardinal Coordinates / Golden Proportion Division Axis -->
    <line x1="12" y1="38" x2="64" y2="38" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.35" />
    <line x1="38" y1="12" x2="38" y2="64" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.35" />
    <polygon points="38,9 41.5,17 34.5,17" fill="url(#goldGradient)" />

    <!-- Fibonacci Golden Ratio Logarithmic Spiral -->
    <path 
      d="M 38 7 A 31 31 0 0 1 69 38 A 21 21 0 0 1 48 59 A 14.5 14.5 0 0 1 33.5 44.5 A 9.5 9.5 0 0 1 43 35 A 6 6 0 0 1 43 41" 
      stroke="url(#goldGradient)" 
      stroke-width="3" 
      stroke-linecap="round" 
      fill="none" 
      filter="url(#goldGlow)" 
    />

    <!-- Radiant Central Core -->
    <circle cx="41.5" cy="39" r="2.8" fill="url(#goldGradient)" />
  </g>

  <!-- ==========================================
       2. TYPOGRAPHY: ALTINORAN YATIRIM HOLDİNG
       ========================================== -->
  <g transform="translate(94, 0)">
    <!-- Brand Title: ALTINORAN -->
    <text 
      x="0" 
      y="43" 
      font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
      font-size="34" 
      font-weight="900" 
      letter-spacing="4.5"
    >
      <tspan fill="#FFFFFF">ALTIN</tspan><tspan fill="url(#goldGradient)">ORAN</tspan>
    </text>

    <!-- Subtitle: YATIRIM HOLDİNG -->
    <text 
      x="1.5" 
      y="63" 
      font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" 
      font-size="12" 
      font-weight="700" 
      letter-spacing="7.5" 
      fill="url(#goldAccent)"
    >
      YATIRIM HOLDİNG
    </text>

    <!-- Golden Divider Line -->
    <line x1="1" y1="71" x2="285" y2="71" stroke="url(#goldGradient)" stroke-width="1.2" stroke-opacity="0.75" />
  </g>
</svg>
